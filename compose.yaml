services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: catanbench
      POSTGRES_PASSWORD: catanbench
      POSTGRES_USER: catanbench
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catanbench -d catanbench"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - catanbench_postgres:/var/lib/postgresql/data

volumes:
  catanbench_postgres:
